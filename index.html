 if(v.sp2>0&&v.l2>0){const j=Math.min(D.V.length-1,Math.round(v.l2/L*100)),Vm=Math.abs(D.V[j])/1000,Vsm=Av*fyt*d/sp/1000,pm=.75*(Vc+Vsm);R.st.push(`ปลอกถี่ปลายคาน: @${v.sp2} cm ยาว ${v.l2} m จากผิวรองรับ; กลางช่วง @${sp} cm → φV<sub>n</sub>(กลางช่วง)=${n2(pm)} t เทียบ V<sub>u</sub> ที่ปลายโซน=${n2(Vm)} t`);ck(R,'φVn(ปลอกกลางช่วง) ≥ Vu ที่ปลายโซนปลอกถี่',Vm,pm,'t','เพิ่มความยาวโซนปลอกถี่หรือลดระยะปลอกกลางช่วง')}
